@'
name: IPO Scout Cron Jobs

on:
  schedule:
    - cron: '0 9 * * 1'
    - cron: '0 10 * * *'
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
    - cron: '0 9 * * *'
    - cron: '0 16 * * *'
    - cron: '0 1 * * 1-5'
    - cron: '0 10 * * 0-4'
    - cron: '0 12 * * 0-4'
  workflow_dispatch:

jobs:
  db-check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run DB Check
        run: "curl -X GET https://ipo.finance-tower.com/api/cron/db-check -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  edinet-scan:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run EDINET Scan
        run: "curl -X GET https://ipo.finance-tower.com/api/cron/edinet-scan -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  detect-ipo-price:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run Detect IPO Price
        run: "curl -X GET https://ipo.finance-tower.com/api/cron/detect-ipo-price -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  track-stock-price:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Track Stock Price (100万円投資シミュレーション用)
        run: "curl -X GET https://ipo.finance-tower.com/api/cron/track-stock-price -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  daily-reminder:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run Daily Reminder
        run: "curl -X GET https://ipo.finance-tower.com/api/cron/daily-reminder -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  generate-x-drafts:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 21 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Generate X Post Drafts
        run: "curl -X GET https://ipo.finance-tower.com/api/cron/generate-x-drafts -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  detect-scraping:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Detect Paid Content Scraping
        run: "curl -X GET https://ipo.finance-tower.com/api/cron/detect-scraping -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  auto-post-morning:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 1 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
      - name: X Auto Post (Morning / 平日10時JST)
        run: "curl -X GET 'https://ipo.finance-tower.com/api/cron/auto-post?slot=morning' -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  auto-post-evening1:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 * * 0-4' || github.event_name == 'workflow_dispatch'
    steps:
      - name: X Auto Post (Evening 1 / 日〜木19時JST)
        run: "curl -X GET 'https://ipo.finance-tower.com/api/cron/auto-post?slot=evening1' -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"

  auto-post-evening2:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 12 * * 0-4' || github.event_name == 'workflow_dispatch'
    steps:
      - name: X Auto Post (Evening 2 / 日〜木21時JST)
        run: "curl -X GET 'https://ipo.finance-tower.com/api/cron/auto-post?slot=evening2' -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"
'@ | Set-Content -Path ".github\workflows\cron.yml" -Encoding UTF8